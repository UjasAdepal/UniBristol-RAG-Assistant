name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create SSH key file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      
      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Check current status
            echo "📊 Current container status:"
            docker ps -a --filter name=bristolbot
            
            # Navigate to project directory
            cd ~/UniBristol-RAG-Assistant || cd ~/bristolbot
            
            # Pull latest code
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main
            
            # Update .env file with API key
            echo "🔑 Updating environment variables..."
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
            
            # Rebuild and restart both services via Compose
            echo "🏗️  Rebuilding and restarting via Compose..."
            docker compose up -d --build
            
            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # Verify container is running
            echo "✅ Verifying deployment..."
            sleep 5
            if docker ps | grep -q bristolbot; then
              echo "✅ Deployment successful! Container is running."
            else
              echo "❌ Deployment failed! Container is not running."
              docker logs bristolbot
              exit 1
            fi
            
            echo "🎉 Deployment complete!"
          ENDSSH
      
      - name: Verify deployment
        run: |
          echo "🔍 Checking if app is accessible..."
          sleep 10
          curl -f http://${{ secrets.EC2_HOST }}:8501 || echo "⚠️  App may still be starting..."
          echo "✅ Deployment workflow completed!"
